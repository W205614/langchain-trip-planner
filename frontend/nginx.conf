limit_conn_zone $binary_remote_addr zone=trip_per_client:10m;
limit_conn_zone $server_name zone=trip_per_server:10m;
map $uri $trip_safe_uri {
    default $uri;
    ~^/(api/shared-trips|shared)/ /shared/redacted;
}
map $uri $trip_upload_key {
    default "";
    /api/knowledge/submissions $binary_remote_addr;
}
limit_req_zone $trip_upload_key zone=trip_upload_rate:10m rate=5r/m;

log_format trip_timed escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","remote":"$remote_addr",'
    '"method":"$request_method","uri":"$trip_safe_uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_seconds":$request_time,"upstream_seconds":"$upstream_response_time",'
    '"upstream_status":"$upstream_status"}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log trip_timed;
    limit_conn trip_per_client 32;
    limit_conn trip_per_server 128;
    limit_conn_status 503;
    limit_req zone=trip_upload_rate burst=5 nodelay;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Capability URLs must never enter request-bearing error logs. Status/request_id
    # remain available in the redacted access log.
    location ^~ /api/shared-trips/ {
        error_log /dev/null;
        client_max_body_size 21m;
        proxy_pass http://backend:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 310s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control no-store always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /shared/ {
        error_log /dev/null;
        add_header Cache-Control no-store always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri /index.html =404;
    }

    location /api/ {
        client_max_body_size 21m;
        proxy_pass http://backend:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 310s;
    }

    location ~ ^/(health|healthz|readyz)$ {
        proxy_pass http://backend:9000;
    }

    location = /metrics {
        return 404;
    }

    location /actuator/ {
        return 404;
    }

    location /internal/ {
        return 404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
