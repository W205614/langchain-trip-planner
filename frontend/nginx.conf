limit_conn_zone $binary_remote_addr zone=trip_per_client:10m;
limit_conn_zone $server_name zone=trip_per_server:10m;

log_format trip_timed escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","remote":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_seconds":$request_time,"upstream_seconds":"$upstream_response_time",'
    '"upstream_status":"$upstream_status"}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log trip_timed;
    limit_conn trip_per_client 32;
    limit_conn trip_per_server 128;
    limit_conn_status 503;

    location /api/ {
        client_max_body_size 21m;
        proxy_pass http://backend:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 310s;
    }

    location ~ ^/(health|healthz|readyz)$ {
        proxy_pass http://backend:9000;
    }

    location = /metrics {
        return 404;
    }

    location /actuator/ {
        return 404;
    }

    location /internal/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
