name: Security gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# No deployment credentials, package publication or repository writes.
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secrets / full history and tracked source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # verified v6, Node 24
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # verified v6, Node 24
        with:
          python-version: '3.11'
      - name: Verify gate failure policy
        run: python -m unittest discover -s tools/tests -v
      - name: Checksum-verified Gitleaks CLI (redacted reports)
        run: python tools/security_gate.py secrets --reports security-reports/secrets
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # verified v6, Node 24
        if: always()
        with:
          name: security-secrets
          path: security-reports/secrets/
          retention-days: 14

  runtime-image-scan:
    name: Runtime images / ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: postgres
            image: postgres:17.11-alpine
          - service: prometheus
            image: trip-security-prometheus:${{ github.sha }}
            dockerfile: prometheus.Dockerfile
          - service: alertmanager
            image: trip-security-alertmanager:${{ github.sha }}
            dockerfile: alertmanager.Dockerfile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Pull current patched runtime image without starting a container
        if: matrix.service == 'postgres'
        env:
          RUNTIME_IMAGE: ${{ matrix.image }}
        run: docker pull "$RUNTIME_IMAGE"
      - name: Build reviewed monitor security derivative from pinned upstream artifacts
        if: matrix.service != 'postgres'
        env:
          RUNTIME_IMAGE: ${{ matrix.image }}
          MONITOR_DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build --pull --build-arg VCS_REF=${{ github.sha }} --file "deploy/images/$MONITOR_DOCKERFILE" --tag "$RUNTIME_IMAGE" deploy/images
      - name: Verify Prometheus rules with the rebuilt official binaries
        if: matrix.service == 'prometheus'
        env:
          RUNTIME_IMAGE: ${{ matrix.image }}
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --entrypoint promtool -v "$PWD/deploy:/rules:ro" -w /rules "$RUNTIME_IMAGE" test rules alerts.test.yml
      - name: Verify Alertmanager config and real isolated alert webhook protocol
        if: matrix.service == 'alertmanager'
        env:
          RUNTIME_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --network none --read-only --entrypoint amtool -v "$PWD/deploy:/rules:ro" "$RUNTIME_IMAGE" check-config /rules/alertmanager.yml
          docker pull python:3.11-slim-trixie
          python tools/monitoring_image_smoke.py --image "$RUNTIME_IMAGE" --cleanup-owned-resources
      - name: Scan the actual pulled immutable image ID
        env:
          RUNTIME_IMAGE: ${{ matrix.image }}
        run: python tools/security_gate.py image --image "$RUNTIME_IMAGE" --reports security-reports/runtime-image
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: security-runtime-image-${{ matrix.service }}
          path: security-reports/runtime-image/
          retention-days: 14

  dependency-scan:
    name: Dependencies / Python Node and resolved Maven SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # verified v6, Node 24
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # verified v5, Node 24
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned scanner tooling from official PyPI
        run: python -m pip install --index-url https://pypi.org/simple -r tools/security-requirements.txt
      - name: Audit lockfiles and all resolved production Java dependencies
        run: python tools/security_gate.py dependencies --vex .github/security-vex.json --reports security-reports/dependencies
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: security-dependencies-and-sbom
          path: security-reports/dependencies/
          retention-days: 14

  codeql:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # Only the official CodeQL SARIF uploader requires this write scope.
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build: manual
          - language: python
            build: none
          - language: javascript-typescript
            build: none
          - language: actions
            build: none
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0 # Source-reviewed CodeQL context requires the frozen/reviewed Git trees.
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'
      - name: Require fresh job-owned CodeQL output
        run: |
          python - <<'PY'
          from pathlib import Path
          output = Path('security-reports/codeql')
          if output.exists() and any(output.iterdir()):
              raise SystemExit('CodeQL output must start empty; historical SARIF is not current evidence')
          output.mkdir(parents=True, exist_ok=True)
          PY
      - name: Initialize official CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4 commit verified 2026-10-26; Node 24
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build }}
          queries: security-extended
      - name: Build Java for semantic analysis (no tests)
        if: matrix.language == 'java-kotlin'
        run: mvn -B -ntp -f business-backend/pom.xml -DskipTests compile
      - name: Analyze and publish SARIF
        id: codeql_analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: /language:${{ matrix.language }}
          output: security-reports/codeql
          upload: always
      # Prepared wiring remains blocked until the separately reviewed activation
      # digest is explicitly pinned. These flags cannot grant authorization.
      - name: Bind current successful language analysis to immutable raw SARIF
        env:
          TRIP_CODEQL_ANALYZE_OUTCOME: ${{ steps.codeql_analyze.outcome }}
        run: python tools/source_equivalence_delta.py --record-codeql-job --directory security-reports/codeql --language ${{ matrix.language }}
      - name: Fail on high/critical CodeQL results
        env:
          TRIP_CODEQL_ANALYZE_OUTCOME: ${{ steps.codeql_analyze.outcome }}
        run: python tools/security_gate.py sarif --directory security-reports/codeql --codeql-context .github/codeql-context-assessments.json --source-equivalence restore-response-v1 --codeql-language ${{ matrix.language }} --reports security-reports/codeql
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: security-codeql-${{ matrix.language }}
          path: security-reports/codeql/
          retention-days: 14

  image-scan:
    name: Images / ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: business-backend
          - service: agent
            context: backend
          - service: frontend
            context: frontend
    env:
      SECURITY_IMAGE: trip-security-${{ matrix.service }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0 # The frozen 220257a business trees must remain available.
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Restore exact historical Agent build inputs (not fresh evaluation)
        if: matrix.service == 'agent'
        run: python tools/restore_historical_build_inputs.py --restore-for-ci --report security-reports/historical-build-inputs.json
      - name: Build the exact revision without runtime secrets
        run: |
          build_options=(--pull --build-arg VCS_REF=${{ github.sha }} --tag "$SECURITY_IMAGE")
          if [ "${{ matrix.service }}" = agent ]; then
            # Reproduce the already reviewed CPython artifact; moving tags do not inherit its exception.
            build_options+=(--build-arg PYTHON_BASE=python@sha256:b7a9e5f6a93d6d4a31f129bbd4bdee69efccb6ded0fb230d78aafaf37af98377)
          fi
          docker build "${build_options[@]}" "${{ matrix.context }}"
      - name: Prove actual Agent runtime constraints for the temporary local-demo exception
        if: matrix.service == 'agent'
        run: |
          mkdir -p security-reports/runtime
          IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$SECURITY_IMAGE")
          python tools/runtime_constraint_probe.py --image "$IMAGE_ID" --reports security-reports/runtime > security-reports/runtime/command-receipt.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads(Path('security-reports/runtime/command-receipt.json').read_text())
          if receipt.get('passed') is not True:
              raise SystemExit('Actual Agent runtime proof failed')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SECURITY_RUNTIME_PROOF=' + receipt['runtime_proof'] + '\n')
          PY
      - name: Verify the changed Agent native library ABI without provider calls
        if: matrix.service == 'agent'
        run: docker run --rm --network none --read-only --memory 1g --cpus 1.0 --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,size=256m --entrypoint python -e TRIP_RUNTIME_ABI_CHECK=1 --mount "type=bind,source=$PWD/backend/tests/test_runtime_security_abi.py,target=/fixture/test_runtime_security_abi.py,readonly" "$SECURITY_IMAGE" -m pytest -q -p no:cacheprovider /fixture/test_runtime_security_abi.py
      - name: Scan the exact artifact and enforce the explicit expiring Agent exception
        env:
          MATRIX_SERVICE: ${{ matrix.service }}
        run: |
          if [ "$MATRIX_SERVICE" = agent ]; then
            python tools/security_gate.py image --image "$SECURITY_IMAGE" --vex .github/security-vex.json --vendor-policy .github/security-vendor-policy.json --risk-acceptance .github/security-risk-acceptance.json --runtime-proof "$SECURITY_RUNTIME_PROOF" --source-equivalence restore-response-v1 --cleanup-owned-resources --reports security-reports/image
          else
            python tools/security_gate.py image --image "$SECURITY_IMAGE" --reports security-reports/image
          fi
      - name: Clean only this CI job's recorded runtime-proof resources
        if: always() && matrix.service == 'agent'
        run: |
          python - <<'PY'
          import subprocess, sys
          from pathlib import Path
          for journal in sorted(Path('security-reports/runtime').glob('runtime-resources-*.json')):
              subprocess.run([sys.executable, 'tools/runtime_constraint_probe.py', '--cleanup-journal', str(journal), '--cleanup-owned-resources'], check=True)
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: security-image-${{ matrix.service }}
          path: security-reports/
          retention-days: 14
