name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ===== 后端: 安装依赖 + 跑测试 =====
  backend-test:
    name: Backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # 测试环境变量 (与 tests/conftest.py 一致, 隔离真实高德/LLM 凭据)
      AMAP_API_KEY: test_amap_key
      LLM_API_KEY: test_llm_key
      LLM_BASE_URL: http://localhost:9999/v1
      LLM_MODEL_ID: test-model
      JWT_SECRET_KEY: test-secret-for-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend tests
        run: |
          pytest -v --tb=short
          python -m app.evals.constraint_benchmark --output ../evidence/constraints.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: constraint-evaluation
          path: evidence/constraints.json

  # ===== 前端: 类型检查 + 构建 =====
  frontend-build:
    name: Frontend build (vue-tsc + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Type-check + build
        run: npm run build

  # ===== 迁移校验: 确认 Alembic 迁移可生成/可执行 =====
  migration-check:
    name: Alembic migration check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations to head
        run: |
          python -m alembic upgrade head
          python -c "import sqlite3; c=sqlite3.connect('data/trip_planner.db'); print('tables:', [r[0] for r in c.execute(\"SELECT name FROM sqlite_master WHERE type='table'\")])"

  docker-compose-check:
    name: Docker Compose config and build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Prepare non-secret Docker environment
        run: |
          cp backend/.env.example backend/.env
          cat >> backend/.env <<'EOF'
          AMAP_API_KEY=test_amap_key
          LLM_API_KEY=test_llm_key
          LLM_BASE_URL=http://localhost:9999/v1
          LLM_MODEL_ID=test-model
          JWT_SECRET_KEY=test-jwt-secret-for-ci-only-0123456789
          EOF
          echo 'VITE_AMAP_WEB_JS_KEY=offline-test-key' > frontend/.env

      - name: Validate Compose configuration
        run: docker compose --env-file backend/.env config --quiet

      - name: Build images
        run: docker compose -p langchain-trip-planner --env-file backend/.env build

      - name: Start isolated validation stack
        run: |
          docker compose -p trip-validation -f docker-compose.validation.yml up -d --wait postgres backend frontend
          docker compose -p trip-validation -f docker-compose.validation.yml exec -T postgres createdb -U trip trip_tests

      - name: PostgreSQL regression tests
        run: docker compose -p trip-validation -f docker-compose.validation.yml run --rm tests

      - name: Nginx contracts and business scenarios
        run: |
          mkdir -p evidence
          docker compose -p trip-validation -f docker-compose.validation.yml exec -T backend python scripts/smoke_http.py --base-url http://frontend
          docker compose -p trip-validation -f docker-compose.validation.yml exec -T backend python scripts/business_benchmark.py --base-url http://frontend --output /tmp/business.json
          docker compose -p trip-validation -f docker-compose.validation.yml cp backend:/tmp/business.json evidence/business.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Browser recovery and isolation
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Isolated recovery drill
        run: python backend/scripts/recovery_drill.py --output evidence/recovery.json

      - name: Local notification failure and recovery
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy:/rules:ro" -w /rules prom/prometheus:v3.2.1 test rules alerts.test.yml
          python backend/scripts/notification_smoke.py
          cp docs/evidence/notifications.json evidence/notifications.json

      - name: Generation interrupted by container restart
        run: |
          python -m pip install httpx==0.28.1
          python backend/scripts/lifecycle_smoke.py
          cp docs/evidence/lifecycle-offline.json evidence/lifecycle.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-evidence
          path: |
            evidence/
            frontend/test-results/

      - name: Remove validation resources
        if: always()
        run: docker compose -p trip-validation -f docker-compose.validation.yml down -v
