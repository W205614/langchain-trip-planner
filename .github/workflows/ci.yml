name: CI

env:
  BUILD_REVISION: ${{ github.sha }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  java-test:
    name: Java business PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: trip
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: trip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trip -d trip"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.30.7
        ports: ["11025:1025", "18025:8025"]
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s --health-timeout 5s --health-retries 20
      s3mock:
        image: adobe/s3mock:5.2.3
        ports: ["19190:9090"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # verified v6, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # verified v5, Node 24
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Java rules, concurrency and PostgreSQL transactions
        working-directory: business-backend
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/trip
          TEST_MAILPIT_URL: http://localhost:18025
          TEST_SMTP_PORT: '11025'
          TEST_S3_ENDPOINT: http://localhost:19190
        run: sh mvnw -B -ntp test
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # verified v6, Node 24
        if: always()
        with:
          name: java-tests
          path: business-backend/target/surefire-reports/
  # ===== 后端: 安装依赖 + 跑测试 =====
  backend-test:
    name: Python Agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # 测试环境变量 (与 tests/conftest.py 一致, 隔离真实高德/LLM 凭据)
      AMAP_API_KEY: test_amap_key
      LLM_API_KEY: test_llm_key
      LLM_BASE_URL: http://localhost:9999/v1
      LLM_MODEL_ID: test-model
      INTERNAL_SERVICE_KEY: test-internal-service-key-for-ci-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # verified v6, Node 24
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # verified v6, Node 24
        with:
          python-version: '3.11.18'
          cache: 'pip'

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install checksum-pinned restic for isolated archive tests
        run: |
          mkdir -p ../.cache/public-tools
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2 --output ../.cache/public-tools/restic.bz2
          echo 'f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c  ../.cache/public-tools/restic.bz2' | sha256sum --check --strict
          bzip2 --decompress --stdout ../.cache/public-tools/restic.bz2 > ../.cache/public-tools/restic
          chmod 700 ../.cache/public-tools/restic
          echo "TEST_RESTIC_BINARY=$GITHUB_WORKSPACE/.cache/public-tools/restic" >> "$GITHUB_ENV"

      - name: Run backend tests
        run: |
          pytest -v --tb=short
          python -m app.evals.constraint_benchmark --output ../evidence/constraints.json
          python scripts/time_window_benchmark.py --output ../evidence/time-windows.json

      - name: Check public API contract against Java controllers
        run: python scripts/check_public_contract.py

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # verified v6, Node 24
        if: always()
        with:
          name: constraint-evaluation
          path: evidence/*.json

  # ===== 前端: 类型检查 + 构建 =====
  frontend-build:
    name: Frontend build (vue-tsc + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # verified v6, Node 24
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # verified v6, Node 24
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Type-check + build
        run: npm run build

  docker-compose-check:
    name: Docker Compose config and build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # verified v6, Node 24
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.18'

      - name: Prepare non-secret Docker environment
        run: |
          cp backend/.env.example backend/.env
          cat >> backend/.env <<'EOF'
          AMAP_API_KEY=test_amap_key
          LLM_API_KEY=test_llm_key
          LLM_BASE_URL=http://localhost:9999/v1
          LLM_MODEL_ID=test-model
          JWT_SECRET_KEY=test-jwt-secret-for-ci-only-0123456789
          EOF
          echo 'VITE_AMAP_WEB_JS_KEY=offline-test-key' > frontend/.env
          python -m pip install python-dotenv
          python backend/scripts/prepare_java_deployment.py

      - name: Validate Compose configuration
        run: docker compose --env-file backend/.env config --quiet

      - name: Build images
        run: |
          docker compose -p langchain-trip-planner --env-file backend/.env build
          docker tag langchain-trip-planner-backend:latest trip-validation-backend:latest
          docker tag langchain-trip-planner-agent:latest trip-validation-agent:latest
          docker tag langchain-trip-planner-agent:latest trip-validation-amap-fixture:latest
          docker tag langchain-trip-planner-frontend:latest trip-validation-frontend:latest

      - name: Start isolated validation stack
        id: validation_start
        run: |
          validation_mfa_key=$(python -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())')
          echo "::add-mask::$validation_mfa_key"
          echo "VALIDATION_ACCOUNT_SECURITY_ENCRYPTION_KEY=$validation_mfa_key" >> "$GITHUB_ENV"
          export VALIDATION_ACCOUNT_SECURITY_ENCRYPTION_KEY="$validation_mfa_key"
          docker compose -p trip-validation -f docker-compose.validation.yml up -d --no-build --wait postgres backend agent frontend

      - name: Agent image packaging and runtime contracts
        run: |
          docker compose -p trip-validation -f docker-compose.validation.yml run --rm tests \
            python -m pytest -q -p no:cacheprovider --basetemp=/tmp/pytest \
            tests/test_agent_layout.py tests/test_agent_import_boundary.py tests/test_internal_contracts.py \
            tests/test_agent_internal.py tests/test_deployment_config.py tests/test_protocol_v2_schema.py

      - name: Nginx contracts and business scenarios
        run: |
          mkdir -p evidence
          docker compose -p trip-validation -f docker-compose.validation.yml exec -T agent python scripts/smoke_http.py --base-url http://frontend
          docker compose -p trip-validation -f docker-compose.validation.yml exec -T agent python scripts/business_benchmark.py --base-url http://frontend --output /tmp/business.json
          docker compose -p trip-validation -f docker-compose.validation.yml cp agent:/tmp/business.json evidence/business.json
          docker compose -p trip-validation -f docker-compose.validation.yml exec -T agent python scripts/assistant_proposal_acceptance.py --base-url http://frontend --output /tmp/assistant-proposal.json
          docker compose -p trip-validation -f docker-compose.validation.yml cp agent:/tmp/assistant-proposal.json evidence/assistant-proposal.json
          docker compose -p trip-validation -f docker-compose.validation.yml exec -T agent python scripts/final_acceptance.py --base-url http://frontend --output /tmp/final-planning-roles.json
          docker compose -p trip-validation -f docker-compose.validation.yml cp agent:/tmp/final-planning-roles.json evidence/final-planning-roles.json
          docker compose -p trip-validation -f docker-compose.validation.yml exec -T agent python scripts/final_scenarios.py --base-url http://frontend --output /tmp/final-scenarios.json
          docker compose -p trip-validation -f docker-compose.validation.yml cp agent:/tmp/final-scenarios.json evidence/final-scenarios.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # verified v6, Node 24
        with:
          node-version: '22'

      - name: Browser recovery and isolation
        working-directory: frontend
        run: |
          python -m pip install httpx==0.28.1
          python ../backend/scripts/optimization_seed_admin.py --project trip-validation --base-url http://127.0.0.1:18080 --output ../.codex-optimization/admin-ci.json --allow-optional-admin-mfa
          npm ci
          npx playwright install --with-deps chromium
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          environment=dict(os.environ)
          environment.update(json.loads(Path('../.codex-optimization/admin-ci.json').read_text(encoding='utf-8')))
          subprocess.run(['npx','playwright','test','--config','playwright.config.ts'],env=environment,check=True)
          PY

      - name: Public account, mail, feedback and export browser flow
        env:
          PUBLIC_VALIDATION_BACKEND_IMAGE: trip-validation-backend:latest
          PUBLIC_VALIDATION_AGENT_IMAGE: trip-validation-agent:latest
          PUBLIC_VALIDATION_FRONTEND_IMAGE: trip-validation-frontend:latest
          PUBLIC_E2E_BASE_URL: http://127.0.0.1:18881
          TEST_MAILPIT_URL: http://127.0.0.1:18026
        run: |
          docker compose -p trip-public-ci -f docker-compose.public-e2e.yml up -d --no-build --wait --wait-timeout 120
          cd frontend
          npx playwright test --config playwright.config.ts public-operations.spec.ts

      - name: Isolated HTTPS proxy and external alert delivery
        id: public_edge
        timeout-minutes: 20
        env:
          PUBLIC_VALIDATION_BACKEND_IMAGE: trip-validation-backend:latest
          PUBLIC_VALIDATION_AGENT_IMAGE: trip-validation-agent:latest
          PUBLIC_VALIDATION_FRONTEND_IMAGE: trip-validation-frontend:latest
        run: |
          python -m pip install -c backend/requirements.lock cryptography PyYAML python-dotenv
          python - <<'PY'
          import ipaddress,json,os,socket,subprocess
          candidate=ipaddress.ip_network(os.getenv('PUBLIC_EDGE_TEST_CIDR','10.253.245.0/28'))
          ids=subprocess.check_output(['docker','network','ls','-q'],text=True).split()
          networks=json.loads(subprocess.check_output(['docker','network','inspect',*ids],text=True)) if ids else []
          for network in networks:
              for config in network.get('IPAM',{}).get('Config') or []:
                  if config.get('Subnet'):
                      existing=ipaddress.ip_network(config['Subnet'])
                      if existing.version==candidate.version and existing.overlaps(candidate):
                          raise SystemExit(f'Edge subnet overlaps {network["Name"]}: {existing}')
          for port in (18443,18082,18028):
              with socket.socket() as probe:
                  probe.bind(('127.0.0.1',port))
          PY
          python backend/scripts/public_edge_acceptance.py prepare
          # Bind-mounted 0600 credentials must be owned by the image's runtime UID.
          sudo chown 65534:65534 .cache/public-edge-validation/alertmanager.yml
          docker compose -p trip-public-edge -f docker-compose.public-edge-validation.yml config --quiet
            docker compose -p trip-public-edge -f docker-compose.public-edge-validation.yml build edge
          docker compose -p trip-public-edge -f docker-compose.public-edge-validation.yml up -d --no-build --wait --wait-timeout 150 postgres backend agent amap-fixture frontend webhook edge mailpit
          python backend/scripts/public_edge_acceptance.py trust
          docker compose -p trip-public-edge -f docker-compose.public-edge-validation.yml up -d --build --wait --wait-timeout 120 alertmanager prometheus
          docker compose -p trip-public-edge -f docker-compose.public-edge-validation.yml exec -T prometheus /bin/promtool check config /etc/prometheus/prometheus.yml
          python backend/scripts/public_edge_acceptance.py https
          python backend/scripts/public_edge_acceptance.py alerts

      - name: Isolated recovery drill
        if: ${{ !cancelled() && steps.validation_start.outcome == 'success' }}
        run: python backend/scripts/java_recovery_drill.py --output evidence/recovery.json

      - name: Java review and publication lifecycle
        if: ${{ !cancelled() && steps.validation_start.outcome == 'success' }}
        run: |
          python -m pip install httpx==0.28.1
          python backend/scripts/java_knowledge_smoke.py --output evidence/knowledge.json
          python backend/scripts/java_api_contract_smoke.py --output evidence/public-api.json

      - name: Local notification failure and recovery
        if: ${{ !cancelled() && steps.validation_start.outcome == 'success' }}
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy:/rules:ro" -w /rules prom/prometheus:v3.15.1 test rules alerts.test.yml alerts.capacity.test.yml
          python backend/scripts/notification_smoke.py
          cp docs/evidence/notifications.json evidence/notifications.json

      - name: Generation interrupted by container restart
        if: ${{ !cancelled() && steps.validation_start.outcome == 'success' }}
        run: |
          python -m pip install httpx==0.28.1
          python backend/scripts/lifecycle_smoke.py
          cp docs/evidence/lifecycle-offline.json evidence/lifecycle.json
          python backend/scripts/java_fault_smoke.py --output evidence/cross-service-faults.json
          INTERNAL_SERVICE_KEY=migration-fixture-internal-01234567890123456789 python backend/scripts/final_fault_acceptance.py --backend-container trip-validation-backend-1 --output evidence/final-faults.json

      - name: Preserve isolated failure diagnostics
        if: failure()
        run: |
          mkdir -p evidence
          # Diagnostics never change the original scenario step's failed status.
          docker compose -p trip-validation -f docker-compose.validation.yml cp agent:/tmp/final-scenarios.json evidence/final-scenarios.json || true
          docker compose -p trip-validation -f docker-compose.validation.yml cp agent:/tmp/final-scenarios-excluded-day-diagnostic.json evidence/final-scenarios-excluded-day-diagnostic.json || true
          docker version
          docker compose version
          docker compose -p trip-validation -f docker-compose.validation.yml ps -a
          docker compose -p trip-validation -f docker-compose.validation.yml logs --no-color --tail 200 > evidence/validation-containers.log

      - name: Preserve public edge diagnostics and stop its resources
        if: always()
        run: |
          trap 'docker compose -p trip-public-edge -f docker-compose.public-edge-validation.yml stop' EXIT
          mkdir -p evidence
          docker compose -p trip-public-edge -f docker-compose.public-edge-validation.yml ps -a > evidence/public-edge-containers.txt
          docker compose -p trip-public-edge -f docker-compose.public-edge-validation.yml logs --no-color --tail 120 > evidence/public-edge-containers.log
          for kind in https alerts; do
            if [ -f ".cache/public-edge-validation/$kind-result.json" ]; then
              cp ".cache/public-edge-validation/$kind-result.json" "evidence/public-edge-$kind.json"
            fi
          done

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # verified v6, Node 24
        if: always()
        with:
          name: reliability-evidence
          path: |
            evidence/
            frontend/test-results/

      - name: Remove validation resources
        if: always()
        run: |
          docker compose -p trip-public-ci -f docker-compose.public-e2e.yml down --remove-orphans
          docker compose -p trip-validation -f docker-compose.validation.yml down --remove-orphans
