name: Assemble reviewed v0.1.3 assets
on:
  push:
    branches: [codex/release-transfer-v013]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify and concatenate the same reviewed bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/assemble_release_assets_v013.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: release-transfer-receipt
          path: release-transfer-receipt.json
          retention-days: 14
