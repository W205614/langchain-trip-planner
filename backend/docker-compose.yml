# 智能旅行规划助手 - 后端服务编排
# 使用: docker compose up -d --build
services:
  backend:
    build: .
    container_name: trip-planner-backend
    ports:
      - "9000:9000"
    # 从 .env 注入 API 密钥 (高德/LLM/千问嵌入)
    env_file:
      - .env
    # 数据卷: SQLite 数据库 + Chroma 向量库持久化到宿主机 backend/data
    volumes:
      - ./data:/app/data
    # 健康检查探针: 与 /health 系统路由配合, 容器不健康自动重启
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # 异常退出自动重启
    restart: unless-stopped
    # 生产可在 .env 设置 DATABASE_URL 为 PostgreSQL；不设置时仍使用本地 SQLite 数据卷。
