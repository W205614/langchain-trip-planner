# Application images only; keep the normal Compose file for data and services.
services:
  backend:
    image: ghcr.io/w205614/langchain-trip-planner-backend:${TRIP_VERSION:-v0.1.3}
  agent:
    image: ghcr.io/w205614/langchain-trip-planner-agent:${TRIP_VERSION:-v0.1.3}
  frontend:
    image: ghcr.io/w205614/langchain-trip-planner-frontend:${TRIP_VERSION:-v0.1.3}
    environment:
      AMAP_WEB_JS_KEY: ${AMAP_WEB_JS_KEY:-}
