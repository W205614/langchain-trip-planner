# Dedicated project (-p trip-validation); no daily credentials or host data mounts.
include:
  - path: ./docker-compose.migration.yml
services:
  notification-receiver:
    image: trip-validation-agent
    entrypoint: [python, scripts/notification_receiver.py]
    ports: ["127.0.0.1:19088:9088"]
    volumes: ["./backend/scripts:/app/scripts:ro"]
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes: ["./deploy/alertmanager.validation.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["127.0.0.1:19093:9093"]
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./deploy/prometheus.validation.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:19090:9090"]
  tests:
    image: trip-validation-agent
    profiles: [test]
    environment:
      AMAP_API_KEY: fixture
      LLM_API_KEY: fixture
      LLM_BASE_URL: http://127.0.0.1:1
      RAG_ENABLED: "false"
    volumes:
      - ./backend/tests:/app/tests:ro
      - ./contracts:/contracts:ro
    command: [python, -m, pytest, -q, -p, "no:cacheprovider", "--basetemp=/tmp/pytest", "--tb=short"]
