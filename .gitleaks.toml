title = "Default Gitleaks rules with reviewed offline fixture values"
[extend]
useDefault = true

[[allowlists]]
description = "One recomputed public langchain-openai source-file SHA256 repeated in exact native-review receipts; both path and literal digest required"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)docs/evidence/native-security-20261110/agent-trip4-(artifact-inventory|review)\.json$''',
  '''(^|/)\.github/security-vendor-remediated\.json$'''
]
regexTarget = "secret"
regexes = ['''^f7ccbe5fe7ab1070977c81305ee20aff84b024e21fdf3466f0fd93eec94c56da$''']

[[allowlists]]
description = "Two Git-verified public frontend source SHA256 values in the exact 8182d40, 843d242, c54ae53, 881817b and e81765b CodeQL reviews, not credentials"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)docs/evidence/native-security-20261110/codeql/(8182d40|843d242|c54ae53|881817b|e81765b)/source-review\.json$''',
  '''(^|/)\.github/codeql-context-remediated\.json$'''
]
regexTarget = "secret"
regexes = ['''^(f133a97a179955497243ef2a55dfad06f83cef66b5a80282a924f5b5e70736c3|f0fda988393a3704b49ad25638e48aa6212bb0b053b4a0f7bf9e6add95b1c95a)$''']

[[allowlists]]
description = "Recomputed SHA512 of the official installed NGINX public signing key, never a private key or arbitrary digest"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(^|/)tools/container_sources\.py$''']
regexTarget = "secret"
regexes = ['''^e09fa32f0a0eab2b879ccbbc4d0e4fb9751486eedda75e35fac65802cc9faa266425edf83e261137a2f4d16281ce2c1a5f4502930fe75154723da014214f0655$''']

[[allowlists]]
description = "Exact public offline test credentials; path AND value, no production files excluded"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)backend/tests/''',
  '''(^|/)backend/scripts/(final_acceptance|final_fault_acceptance|final_scenarios|assistant_proposal_acceptance|business_benchmark)\.py$''',
  '''(^|/)frontend/e2e/'''
]
regexTarget = "secret"
regexes = [
  '''^(0123456789abcdefghijklmnopqrstuv|internal-test-key-01234567890123456789|isolated-improvement-123|isolated-final123|isolated-fault123|isolated-scenarios123|evaluation123)$'''
]

[[allowlists]]
description = "Ascending-byte AES key used only by the isolated account integration test"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(^|/)business-backend/src/test/java/com/tripplanner/SecurityOptimizationIntegrationTest\.java$''']
regexTarget = "secret"
regexes = ['''^AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=$''']

[[allowlists]]
description = "Exact public account test keys; both test path and literal value must match"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(^|/)business-backend/src/test/java/com/tripplanner/(EmailAccountIntegrationTest|PublicActorIntegrationTest)\.java$''']
regexTarget = "secret"
regexes = ['''^(AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=|actor-test-jwt-012345678901234567890123456789|actor-test-internal-012345678901234567890123456789)$''']

[[allowlists]]
description = "Public dummy AES key in isolated browser stacks only"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(^|/)docker-compose\.public-(e2e|edge-validation)\.yml$''']
regexTarget = "secret"
regexes = ['''^(MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=?|0123456789abcdef0123456789abcdef)$''']


