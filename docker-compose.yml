name: langchain-trip-planner
services:
  postgres:
    image: postgres:17.11-alpine
    env_file: ./deploy/runtime/postgres.env
    volumes: ["java_business_data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U trip -d trip_java]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

  backend:
    build:
      context: ./business-backend
      args:
        VCS_REF: ${BUILD_REVISION:-unknown}
    env_file: ./deploy/runtime/business.env
    volumes: ["./backend/data/knowledge_uploads:/data/uploads"]
    expose: ["9000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9000/readyz]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

  agent:
    build:
      context: ./backend
      args:
        VCS_REF: ${BUILD_REVISION:-unknown}
    env_file: ./deploy/runtime/agent.env
    command: [uvicorn, app.agent_api.main:app, --host, 0.0.0.0, --port, "9000", --workers, "1"]
    environment:
      DATA_DIR: /app/runtime
      CHROMA_DIR: /app/data/chroma
      OUTBOUND_LEDGER_REQUIRED: "true"
    volumes:
      - ./backend/data/chroma:/app/data/chroma
      - ./backend/data/agent-runtime:/app/runtime
    expose: ["9000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:9000/readyz',timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

  frontend:
    build:
      context: ./frontend
      args:
        VCS_REF: ${BUILD_REVISION:-unknown}
    ports:
      - "127.0.0.1:${APP_PORT:-8380}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
volumes:
  java_business_data:
