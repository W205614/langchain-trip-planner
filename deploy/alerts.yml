groups:
  - name: trip-operational-governance
    rules:
      - alert: TripSchedulerOwnershipLost
        expr: trip_scheduler_owned == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "调度所有权丢失，停止领取并拒绝旧执行；按运行手册受控重启"
      - alert: TripBackupStale
        expr: trip_backup_age_seconds > 86400
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "超过24小时没有已验证本机备份"
      - alert: TripOffhostBackupStale
        expr: trip_offhost_backup_age_seconds > 172800
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "异机备份未配置或超过48小时未核实；本机副本不计作异机"
  - name: trip-reliability
    rules:
      - alert: TripDraftRateHigh
        expr: sum(increase(trip_plan_total{outcome="draft"}[10m])) >= 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "未完成草稿增多，检查质量问题码和上游依赖"
          runbook_url: "docs/operations/optimization-governance.md#告警容量和保留"
      - alert: TripSyncStalled
        expr: trip_oldest_sync_age_seconds > 600
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "索引同步停滞，检查 worker 与依赖后重放失败任务"
          runbook_url: "docs/operations/optimization-governance.md#告警容量和保留"
      - alert: TripDiskLow
        expr: (trip_data_disk_free_ratio < 0.1) and (trip_data_disk_sample_available == 1)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "数据卷空间不足，暂停上传并检查备份和日志保留"
          runbook_url: "docs/operations/optimization-governance.md#告警容量和保留"
      - alert: TripDatabaseSizeHigh
        expr: (trip_database_size_bytes > trip_database_size_warning_bytes) and (trip_database_capacity_sample_available == 1) and (trip_database_capacity_last_success_age_seconds <= 180)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "当前数据库文件大小超过配置预警值；不等于PG卷剩余空间或硬配额"
          runbook_url: "docs/operations/optimization-governance.md#告警容量和保留"
      - alert: TripCapacitySamplingUnknown
        expr: (trip_database_capacity_sample_available == 0) or (trip_database_capacity_last_success_age_seconds > 180) or absent(trip_database_capacity_sample_available{job="trip"}) or (trip_data_disk_sample_available == 0) or absent(trip_data_disk_sample_available{job="trip"})
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "数据库或上传容量采样失败、缺失或数据库样本过期；未知值不代表健康"
          runbook_url: "docs/operations/optimization-governance.md#告警容量和保留"
      - alert: TripRagDegraded
        expr: sum(increase(trip_rag_events_total{reason=~"timeout|busy|lock_timeout|entity_rejected"}[10m])) >= 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "攻略增强拒绝或超时增多；检查来源归属、嵌入服务和索引"
          runbook_url: "docs/operations/optimization-governance.md#告警容量和保留"
      - alert: TripServiceDown
        expr: up{job=~"trip|trip-agent"} == 0
        for: 1m
        labels:
          severity: critical
      - alert: TripSyncBacklog
        expr: sum(trip_durable_jobs{kind=~"history|knowledge",status=~"failed|waiting|retry"}) > 0
        for: 5m
        labels:
          severity: warning
      - alert: TripQueueStalled
        expr: trip_oldest_queue_age_seconds > 120
        for: 30s
        labels:
          severity: warning
      - alert: TripTaskTimeouts
        expr: delta(trip_task_failures{code="TASK_TIMEOUT"}[5m]) > 0
        for: 0s
        labels:
          severity: warning
      - alert: TripUpstreamCircuitOpen
        expr: sum(increase(trip_upstream_circuit_opened_total[5m])) > 0
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Agent 或高德连续失败已触发熔断，当前请求会快速失败"
      - alert: TripCapacityRejected
        expr: sum(increase(trip_upstream_rejected_total{reason="capacity"}[5m])) + sum(increase(trip_agent_capacity_rejected_total[5m])) >= 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "慢能力并发槽已满；检查队列、上游耗时与流量来源"
      - alert: TripServletThreadsHigh
        expr: max(tomcat_threads_busy_threads) / clamp_min(max(tomcat_threads_config_max_threads), 1) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Java 请求线程使用率持续超过 80%"
      - alert: TripDatabasePoolWaiting
        expr: max(hikaricp_connections_pending) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "数据库连接池出现持续等待"
