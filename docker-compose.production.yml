# Standalone single-host production definition. Prepare private runtime env first.
services:
  postgres:
    extends: {file: docker-compose.yml, service: postgres}
  backend:
    extends: {file: docker-compose.yml, service: backend}
    environment:
      APP_ENV: production
      VALIDATION_ALLOW_FIXTURES: "no"
    volumes: ["production_uploads:/data/uploads"]
  agent:
    extends: {file: docker-compose.yml, service: agent}
    environment:
      APP_ENV: production
      VALIDATION_ALLOW_FIXTURES: "no"
    volumes:
      - production_chroma:/app/data/chroma
      - production_agent_runtime:/app/runtime
  frontend:
    extends: {file: docker-compose.yml, service: frontend}
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.2.1
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
volumes:
  java_business_data:
  production_uploads:
  production_chroma:
  production_agent_runtime:
