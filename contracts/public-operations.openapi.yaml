components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: trip_session
      description: HttpOnly会话Cookie；写操作必须发送trip_csrf值为X-CSRF-Token。
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Csrf:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
      description: 使用trip_session Cookie的写请求必须发送trip_csrf Cookie的值；Bearer请求不要求此头。
    AuthMode:
      name: X-Auth-Mode
      in: header
      required: false
      schema:
        type: string
        enum:
        - cookie
      description: cookie模式返回CookieLogin并设置HttpOnly trip_session与可读取的trip_csrf；省略则返回BearerLogin。
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int64
        default: 1
        minimum: 1
        maximum: 100000
    UserId:
      name: uid
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    JobId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        description: 当前反馈version的十进制整数；不是带引号的ETag。成功响应给出新version；冲突409需重新读取反馈。
    ErasureReceipt:
      name: X-Erasure-Receipt
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{43}$
      description: 下载回执中的receipt。此接口只使用回执，忽略登录凭证；缺失、错误或30天过期均404。
  responses:
    ApiError:
      description: 已处理业务/鉴权错误。401凭证无效；403权限/邮箱未验证；404未找到或回执无效；409状态/版本冲突；410导出过期；422输入无效；429限额；503外部能力不可用。 框架错误在HTML
        Accept协商下可返回错误页面。
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - $ref: '#/components/schemas/FrameworkError'
        text/html:
          schema:
            type: string
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: false
        detail:
          type: string
        message:
          type: string
        error_code:
          type: string
        code:
          type: string
      required:
      - detail
    Success:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
      required:
      - success
    Message:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
      required:
      - success
      - message
    Reauthenticate:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        reauthenticate:
          type: boolean
          const: true
        message:
          type: string
      required:
      - success
      - reauthenticate
      - message
    Registration:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 8
          maxLength: 64
          writeOnly: true
          description: 最多72个UTF-8字节，不能等于用户名或常见弱密码。
        email:
          type:
          - string
          - 'null'
          format: email
          maxLength: 254
          description: email_verified模式必填；legacy模式可省略。
      required:
      - username
      - password
      x-java-record: UsersController.Registration
    Login:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 128
          writeOnly: true
        totp_code:
          type:
          - string
          - 'null'
          maxLength: 6
          writeOnly: true
          description: 已开启验证器时必须提供当前未使用的6位数字。
      required:
      - username
      - password
      x-java-record: UsersController.Login
    CookieLogin:
      type: object
      additionalProperties: false
      properties:
        token_type:
          type: string
          const: cookie
        username:
          type: string
        is_admin:
          type: boolean
        mfa_setup_required:
          type: boolean
      required:
      - token_type
      - username
      - is_admin
      - mfa_setup_required
    BearerLogin:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
          description: 服务器签发的JWT；私有客户端凭证。
        token_type:
          type: string
          const: bearer
        username:
          type: string
        is_admin:
          type: boolean
      required:
      - access_token
      - token_type
      - username
      - is_admin
    LoginResult:
      oneOf:
      - $ref: '#/components/schemas/CookieLogin'
      - $ref: '#/components/schemas/BearerLogin'
    AccountState:
      type: string
      enum:
      - active
      - disabled
      - deleting
      - deleted
    PublicUser:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        is_admin:
          type: boolean
        created_at:
          type: string
          description: 服务序列化的UTC时间。
        email:
          type:
          - string
          - 'null'
        email_verified_at:
          type:
          - string
          - 'null'
          description: 服务序列化的UTC时间。
        account_state:
          $ref: '#/components/schemas/AccountState'
        email_verified:
          type: boolean
      required:
      - id
      - username
      - is_admin
      - created_at
      - email
      - email_verified_at
      - account_state
      - email_verified
    AdminUser:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type:
          - string
          - 'null'
        email_verified_at:
          type:
          - string
          - 'null'
          description: 服务序列化的UTC时间。
        account_state:
          $ref: '#/components/schemas/AccountState'
        is_admin:
          type: boolean
        created_at:
          type: string
          description: 服务序列化的UTC时间。
      required:
      - id
      - username
      - email
      - email_verified_at
      - account_state
      - is_admin
      - created_at
    AuthOptions:
      type: object
      additionalProperties: false
      properties:
        registration_mode:
          type: string
          enum:
          - legacy
          - email_verified
        email_available:
          type: boolean
      required:
      - registration_mode
      - email_available
    EmailStatus:
      type: object
      additionalProperties: false
      properties:
        email:
          type:
          - string
          - 'null'
        verified:
          type: boolean
        verification_required:
          type: boolean
        available:
          type: boolean
        pending_email:
          type:
          - string
          - 'null'
      required:
      - email
      - verified
      - verification_required
      - available
      - pending_email
    EmailBinding:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          maxLength: 128
          writeOnly: true
        totp_code:
          type:
          - string
          - 'null'
          maxLength: 6
          writeOnly: true
          description: 已开启验证器时必填；每个验证码只能使用一次。
      required:
      - email
      - password
      x-java-record: EmailAccountController.Binding
    EmailToken:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          maxLength: 128
          writeOnly: true
      required:
      - token
      x-java-record: EmailAccountController.Token
    EmailResetRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
      x-java-record: EmailAccountController.ResetRequest
    EmailReset:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          maxLength: 128
          writeOnly: true
        new_password:
          type: string
          minLength: 8
          maxLength: 64
          writeOnly: true
          description: 最多72个UTF-8字节，禁止常见弱密码和用户名。
        totp_code:
          type:
          - string
          - 'null'
