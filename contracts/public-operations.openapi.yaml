openapi: 3.1.0
info:
  title: Trip Planner Public Operations API
  version: '2026-11-07'
  description: 公开运营增量契约，以Java Controller记录和服务返回白名单为准。默认同源。Cookie写请求需X-CSRF-Token；Bearer兼容。管理员操作受ROLE_ADMIN及部署MFA设置约束。时间存储使用UTC；配额按UTC日界。当前文件不替代既有行程规划API与internal-v1/v2契约。
servers:
- url: /
security:
- sessionCookie: []
- bearerAuth: []
tags:
- name: account
- name: operations
- name: admin
paths:
  /api/auth/options:
    get:
      operationId: authOptions
      summary: 读取注册及邮件配置状态
      tags:
      - account
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 用于关联服务日志的请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthOptions'
        default:
          $ref: '#/components/responses/ApiError'
      security: []
      description: email_available表示SMTP已配置，不是连接探测或收件箱送达证明。
  /api/auth/register:
    post:
      operationId: register
      summary: 注册并登录
      tags:
      - account
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 用于关联服务日志的请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
      security: []
      parameters:
      - $ref: '#/components/parameters/AuthMode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      description: email_verified模式邮箱必填，账号与验证邮件发件箱同事务；失败不保留半成品账号。验证完成前可登录读取资料，付费AI、上传与发布受服务端策略限制。
  /api/auth/login:
    post:
      operationId: login
      summary: 密码及可选TOTP登录
      tags:
      - account
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 用于关联服务日志的请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '401':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
      security: []
      parameters:
      - $ref: '#/components/parameters/AuthMode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      description: 开启TOTP的账号必须提供未使用的当前验证码。不可用账号拒绝登录。
  /api/auth/logout:
    post:
      operationId: logout
      summary: 撤销本人所有旧会话
      tags:
      - account
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 用于关联服务日志的请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
      parameters:
      - $ref: '#/components/parameters/Csrf'
  /api/auth/me:
    get:
      operationId: currentUser
      summary: 读取本人公开字段白名单
      tags:
      - account
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 用于关联服务日志的请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '401':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
  /api/account/email:
    get:
      operationId: emailStatus
      summary: 读取本人邮箱与待验证地址
      tags:
      - account
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 用于关联服务日志的请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailStatus'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
    post:
      operationId: bindEmail
      summary: 验证当前身份后绑定或更换邮箱
      tags:
      - account
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 用于关联服务日志的请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailBinding'
      description: 已启用TOTP时需当前验证码；新邮箱确认后才替换原邮箱。每分钟最多一次、每小时最多5次验证邮件请求。
  /api/account/email/resend:
    post:
      operationId: resendEmail
      summary: 重新发送最新验证链接
      tags:
      - account
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 用于关联服务日志的请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      description: 沿用已申请的目标地址，不接受新的邮箱参数；新链接使旧链接失效。
  /api/auth/email/confirm:
    post:
      operationId: confirmEmail
      summary: 消费一次性邮箱验证令牌
      tags:
      - account
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 用于关联服务日志的请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '403':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailToken'
      description: 链接30分钟有效，重复或过期409；不需要登录Cookie或CSRF。
  /api/auth/email/request-reset:
    post:
      operationId: requestPasswordReset
      summary: 申请邮件密码重置
      tags:
      - account
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 用于关联服务日志的请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailResetRequest'
      description: 未知、未验证、不可用账号及账号级请求限流均返回相同成功提示，防止按响应枚举邮箱。邮件未配置返回503。
  /api/auth/email/reset:
    post:
      operationId: resetPassword
      summary: 使用邮件令牌和所需TOTP重设密码
      tags:
      - account
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 用于关联服务日志的请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reauthenticate'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailReset'
      description: 令牌15分钟有效，仅一次使用；已开启的MFA保持有效。成功撤销所有旧登录与该账号其他重置令牌。
  /api/account/notification-preferences:
    get:
      operationId: notificationPreferences
      summary: 读取本人邮件订阅状态
      tags:
      - account
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 用于关联服务日志的请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
    put:
      operationId: updateNotificationPreferences
      summary: 修改本人邮件订阅状态
      tags:
      - account
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 用于关联服务日志的请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferencesUpdate'
      description: 开启需要已验证邮箱及配置SMTP。只发送开启后的新通知，关闭时清除未发送的通知邮件载荷；已交给SMTP的邮件不能撤回。
  /api/feedback:
    get:
      operationId: feedbackList
      summary: 分页读取本人的反馈
      tags:
      - operations
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 用于关联服务日志的请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackPage'
        '401':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
      parameters:
      - $ref: '#/components/parameters/Page'
    post:
      operationId: createFeedback
      summary: 提交问题反馈
      tags:
      - operations
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 用于关联服务日志的请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedId'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackCreate'
      description: 关联行程和任务必须属于本人。每账号每小时最多10次。
  /api/usage/limits:
    get:
      operationId: usageLimits
      summary: 读取本人UTC日配额与调用预留
      tags:
      - operations
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 用于关联服务日志的请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaSummary'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
      description: 视觉调用归入text额度。预留不是实际账单；supplier_usage与usage/summary可能描述同一次调用，不能相加计费。
  /api/admin/operations/users:
    get:
      operationId: adminUsers
      summary: 分页搜索账号白名单
      tags:
      - admin
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 用于关联服务日志的请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersPage'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
      x-required-role: ADMIN
      parameters:
      - $ref: '#/components/parameters/Page'
      - name: query
        in: query
        schema:
          type: string
          maxLength: 64
          default: ''
      description: 需要管理员权限；ADMIN_MFA_REQUIRED=true时必须已完成TOTP设置并通过登录验证。
  /api/admin/operations/users/{uid}/state:
    put:
      operationId: adminUserState
      summary: 停用或恢复账号
      tags:
      - admin
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 用于关联服务日志的请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStateResult'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
      x-required-role: ADMIN
      parameters:
      - $ref: '#/components/parameters/Csrf'
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStateUpdate'
      description: 需要管理员权限；ADMIN_MFA_REQUIRED=true时必须已完成TOTP设置并通过登录验证。禁止恢复deleting/deleted账号，禁止停用最后一个可用管理员。状态变化撤销旧会话，停用停止活动规划任务。
  /api/admin/operations/users/{uid}/quotas:
    get:
      operationId: adminUserQuotas
      summary: 读取指定用户有效配额与覆盖值
      tags:
      - admin
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 用于关联服务日志的请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaSummary'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
      x-required-role: ADMIN
      parameters:
      - $ref: '#/components/parameters/UserId'
      description: 需要管理员权限；ADMIN_MFA_REQUIRED=true时必须已完成TOTP设置并通过登录验证。
    put:
      operationId: adminUpdateQuotas
      summary: 设置完整的用户配额覆盖
      tags:
      - admin
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 用于关联服务日志的请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaSummary'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
      x-required-role: ADMIN
      parameters:
      - $ref: '#/components/parameters/Csrf'
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotaUpdate'
      description: 需要管理员权限；ADMIN_MFA_REQUIRED=true时必须已完成TOTP设置并通过登录验证。
  /api/admin/operations/feedback:
    get:
      operationId: adminFeedback
      summary: 分页筛选全部反馈
      tags:
      - admin
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 用于关联服务日志的请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackPage'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
      x-required-role: ADMIN
      parameters:
      - $ref: '#/components/parameters/Page'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ''
          - open
          - processing
          - closed
          default: ''
      description: 需要管理员权限；ADMIN_MFA_REQUIRED=true时必须已完成TOTP设置并通过登录验证。
  /api/admin/operations/feedback/{id}:
    put:
      operationId: adminReplyFeedback
      summary: 按版本回复或关闭反馈
      tags:
      - admin
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 用于关联服务日志的请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResult'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
      x-required-role: ADMIN
      parameters:
      - $ref: '#/components/parameters/Csrf'
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackReply'
      description: 需要管理员权限；ADMIN_MFA_REQUIRED=true时必须已完成TOTP设置并通过登录验证。
  /api/admin/mail:
    get:
      operationId: adminMail
