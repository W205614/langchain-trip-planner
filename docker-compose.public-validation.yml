# Standalone test dependencies; never loads daily credentials or mounts.
name: trip-public-validation
services:
  postgres:
    image: postgres:17.11-alpine
    environment: {POSTGRES_USER: trip, POSTGRES_PASSWORD: isolated-test-only, POSTGRES_DB: trip}
    ports: ['127.0.0.1:15439:5432']
    healthcheck:
      test: [CMD-SHELL, pg_isready -U trip -d trip]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.30.7
    ports: ['127.0.0.1:11025:1025', '127.0.0.1:18025:8025']
  s3mock:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: trip-validation
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /tmp/trip-validation
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
    ports: ['127.0.0.1:19190:9090']
    healthcheck:
      test: [CMD, wget, --spider, -q, 'http://localhost:9090/favicon.ico']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 15s
